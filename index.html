<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
  <title>シンプルな家計簿アプリ
  </title>
</head>
<body>
  <main>
    <h1>シンプルな家計簿アプリ</h1>

    <form>
      <p>
        <label for="date">日付</label>
        <input type="date" id="date" name="date" required>
      </p>

      <p>
        <label for="item">品目</label>
        <input type="text" id="item" name="item" required>
      </p>

      <fieldset>
        <legend>収支区分</legend>
        <label>
          <input type="radio" name="type" value="expense" checked>
          支出
        </label>
        <label>
          <input type="radio" name="type" value="income">
          収入
        </label>
      </fieldset>

      <p>
        <label for="amount">金額（円）</label>
        <input type="number" id="amount" name="amount" min="0" step="1" required>
      </p>

      <button type="submit">追加</button>
    </form>

    <section aria-labelledby="total-heading">
      <h2 id="total-heading">合計金額</h2>
      <p><output id="total" name="total">0円</output></p>
    </section>

    <section aria-labelledby="records-heading">
      <h2 id="records-heading">記録一覧</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">収支区分</th>
            <th scope="col">金額</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">記録はありません</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
